name: Amazon End-to-End Pilot

on:
  push:
    branches:
      - test/amazon-pilot

concurrency:
  group: amazon-end-to-end-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    environment: smoke
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc --noEmit -p tsconfig.amazon-pilot.json
      - run: npm test
      - run: git diff --check
      - run: node scripts/check-smoke-config.mjs
      - name: Deploy isolated Amazon pilot Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.amazon-pilot.jsonc | tee /tmp/amazon-pilot-deploy.log
          worker_url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/amazon-pilot-deploy.log | tail -1)
          test -n "$worker_url"
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
      - name: Run Amazon end-to-end pilot
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in {1..15}; do
            if curl --fail --silent --show-error --max-time 10 "${{ steps.deploy.outputs.worker_url }}/health" > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          pilot_status=$(curl --silent --show-error --max-time 180 --output /tmp/amazon-pilot-result.json --write-out '%{http_code}' \
            "${{ steps.deploy.outputs.worker_url }}/health?run=1")
          PILOT_HTTP_STATUS="$pilot_status" node - <<'NODE'
          const fs = require("node:fs");
          let result;
          try { result = JSON.parse(fs.readFileSync("/tmp/amazon-pilot-result.json", "utf8")); }
          catch { console.error(JSON.stringify({ event: "amazon_pilot_failed", code: "NON_JSON_RESPONSE", httpStatus: Number(process.env.PILOT_HTTP_STATUS) })); process.exit(1); }
          if (result.error) {
            console.error(JSON.stringify({ event: "amazon_pilot_failed", ...result.error }));
            process.exit(1);
          }
          const safe = result.report;
          console.log(JSON.stringify({ event: "amazon_pilot_result", ...safe }));
          if (!safe.pass) process.exit(2);
          const png = Buffer.from(result.pngBase64, "base64");
          if (png.length !== safe.card.byteSize || png.readUInt32BE(16) !== safe.card.width || png.readUInt32BE(20) !== safe.card.height) process.exit(3);
          fs.writeFileSync("amazon-card-pilot.png", png);
          NODE
          test "$pilot_status" = "200"
      - name: Upload Amazon card artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-card-pilot
          path: amazon-card-pilot.png
          if-no-files-found: error
          retention-days: 7
      - name: Delete isolated Amazon pilot Worker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/amazon-pilot-delete.json --write-out '%{http_code}' --request DELETE \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/affiliate-deal-card-amazon-pilot")
          if [[ "$status" != "200" && "$status" != "404" ]]; then
            echo "Temporary Worker cleanup failed with HTTP ${status}."
            exit 1
          fi
