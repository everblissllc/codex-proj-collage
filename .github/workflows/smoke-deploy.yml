name: Deploy temporary smoke Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: affiliate-deal-card-smoke
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-smoke-config.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:vitest -- test/product.test.ts
      - run: npx wrangler deploy --dry-run --config wrangler.smoke.jsonc

  deploy-smoke:
    needs: verify
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    environment: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-smoke-config.mjs
      - name: Check smoke environment secrets before creating resources
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          TEST_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TEST_TELEGRAM_WEBHOOK_SECRET }}
        run: |
          node -e '
            const e = process.env;
            const required = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "TEST_TELEGRAM_BOT_TOKEN", "TEST_TELEGRAM_WEBHOOK_SECRET"];
            if (required.some((key) => !e[key])) throw new Error("A smoke environment secret is missing");
            if (e.TEST_TELEGRAM_WEBHOOK_SECRET.length > 256 || !/^[A-Za-z0-9_-]+$/.test(e.TEST_TELEGRAM_WEBHOOK_SECRET)) {
              throw new Error("The test Telegram webhook secret has an invalid format");
            }
            console.log("Four smoke environment secrets are present");
          '
      - name: Create smoke Queue if missing
        run: node scripts/ensure-smoke-queue.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy smoke Worker
        run: npx wrangler deploy --config wrangler.smoke.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Provision and verify test Telegram secrets on smoke Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          TEST_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TEST_TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          node -e '
            const token = process.env.TEST_TELEGRAM_BOT_TOKEN;
            const secret = process.env.TEST_TELEGRAM_WEBHOOK_SECRET;
            if (!token || !secret || secret.length > 256 || !/^[A-Za-z0-9_-]+$/.test(secret)) {
              throw new Error("Missing test bot token or invalid test webhook secret");
            }
            process.stdout.write(JSON.stringify({
              TELEGRAM_BOT_TOKEN: token,
              TELEGRAM_WEBHOOK_SECRET: secret
            }));
          ' | npx wrangler secret bulk --config wrangler.smoke.jsonc --name affiliate-deal-card-smoke
          npx wrangler secret list --format json --config wrangler.smoke.jsonc --name affiliate-deal-card-smoke | node -e '
            let data = "";
            process.stdin.on("data", (chunk) => { data += chunk; });
            process.stdin.on("end", () => {
              const names = new Set(JSON.parse(data).map((item) => item.name));
              if (!names.has("TELEGRAM_BOT_TOKEN") || !names.has("TELEGRAM_WEBHOOK_SECRET")) {
                throw new Error("Smoke Worker Telegram secret bindings are missing");
              }
              console.log("Smoke Worker test Telegram secret bindings verified");
            });
          '
