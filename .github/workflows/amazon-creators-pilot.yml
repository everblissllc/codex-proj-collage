name: Amazon Creators API Pilot

on:
  push:
    branches:
      - test/amazon-pilot

jobs:
  pilot:
    runs-on: ubuntu-latest
    environment: amazon-pilot
    env:
      AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
      AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
      AMAZON_CREATORS_CREDENTIAL_VERSION: ${{ vars.AMAZON_CREATORS_CREDENTIAL_VERSION }}
      AMAZON_CREATORS_MARKETPLACE: ${{ vars.AMAZON_CREATORS_MARKETPLACE }}
      AMAZON_CREATORS_PARTNER_TAG: ${{ vars.AMAZON_CREATORS_PARTNER_TAG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in AMAZON_CREATORS_CLIENT_ID AMAZON_CREATORS_CLIENT_SECRET AMAZON_CREATORS_CREDENTIAL_VERSION AMAZON_CREATORS_MARKETPLACE AMAZON_CREATORS_PARTNER_TAG; do
            if [[ -z "${!key:-}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing amazon-pilot configuration key: %s\n' "${missing[@]}" >&2
            exit 2
          fi
          if [[ "$AMAZON_CREATORS_CREDENTIAL_VERSION" != "3.1" ]]; then
            printf 'Invalid amazon-pilot configuration key: AMAZON_CREATORS_CREDENTIAL_VERSION\n' >&2
            exit 2
          fi
      - name: Validate source and direct pilot
        run: |
          npm run typecheck
          npm test
          git diff --check
          node scripts/check-smoke-config.mjs
          npx tsc --noEmit -p tsconfig.amazon-creators-pilot.json
      - name: Run one direct Creators API credential test
        shell: bash
        run: |
          set -euo pipefail
          pilot_out="$RUNNER_TEMP/amazon-creators-direct-pilot"
          npx tsc -p tsconfig.amazon-creators-pilot.json --noEmit false --outDir "$pilot_out"
          node "$pilot_out/pilot/amazon-creators-direct-runner.js"
