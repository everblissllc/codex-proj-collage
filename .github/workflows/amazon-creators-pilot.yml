name: Amazon Creators API Pilot

on:
  push:
    branches:
      - test/amazon-pilot

jobs:
  pilot:
    runs-on: ubuntu-latest
    environment: amazon-pilot
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
      AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
      AMAZON_CREATORS_CREDENTIAL_VERSION: ${{ vars.AMAZON_CREATORS_CREDENTIAL_VERSION }}
      AMAZON_CREATORS_MARKETPLACE: ${{ vars.AMAZON_CREATORS_MARKETPLACE }}
      AMAZON_CREATORS_PARTNER_TAG: ${{ vars.AMAZON_CREATORS_PARTNER_TAG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN AMAZON_CREATORS_CLIENT_ID AMAZON_CREATORS_CLIENT_SECRET AMAZON_CREATORS_CREDENTIAL_VERSION AMAZON_CREATORS_MARKETPLACE AMAZON_CREATORS_PARTNER_TAG; do
            if [[ -z "${!key:-}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing amazon-pilot configuration key: %s\n' "${missing[@]}" >&2
            exit 2
          fi
          if [[ "$AMAZON_CREATORS_CREDENTIAL_VERSION" != "3.1" ]]; then
            printf 'Invalid amazon-pilot configuration key: AMAZON_CREATORS_CREDENTIAL_VERSION\n' >&2
            exit 2
          fi
      - name: Validate source and isolated E2E pilot
        run: |
          npm run typecheck
          npm test
          git diff --check
          node scripts/check-smoke-config.mjs
          npx tsc --noEmit -p tsconfig.amazon-creators-pilot.json
          npx wrangler deploy --dry-run --config wrangler.amazon-creators-pilot.jsonc
      - name: Remove previous isolated pilot Worker if present
        shell: bash
        run: |
          set -euo pipefail
          script_name="affiliate-amazon-pilot-35262933995"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${script_name}"
          status=$(curl --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /dev/null --write-out '%{http_code}' "$endpoint")
          if [[ "$status" == "404" ]]; then
            echo "Previous temporary Worker status: already absent"
          elif [[ "$status" == "200" ]]; then
            delete_status=$(curl --silent --show-error --max-time 30 \
              --request DELETE \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --output /dev/null --write-out '%{http_code}' "$endpoint")
            if [[ "$delete_status" != "200" && "$delete_status" != "204" ]]; then
              echo "Previous temporary Worker deletion failed: HTTP $delete_status" >&2
              exit 2
            fi
            echo "Previous temporary Worker status: deleted"
          else
            echo "Previous temporary Worker inspection failed: HTTP $status" >&2
            exit 2
          fi
      - name: Prepare isolated pilot
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          worker_name="affiliate-amazon-pilot-${GITHUB_RUN_ID}"
          pilot_secret=$(openssl rand -hex 32)
          echo "::add-mask::$pilot_secret"
          export PILOT_RUN_SECRET="$pilot_secret"
          echo "worker_name=$worker_name" >> "$GITHUB_OUTPUT"
          echo "PILOT_RUN_SECRET=$pilot_secret" >> "$GITHUB_ENV"
          echo "Temporary Worker: $worker_name"
          node -e '
            const { writeFileSync } = require("node:fs");
            const keys = [
              "AMAZON_CREATORS_CLIENT_ID", "AMAZON_CREATORS_CLIENT_SECRET",
              "AMAZON_CREATORS_CREDENTIAL_VERSION", "AMAZON_CREATORS_MARKETPLACE",
              "AMAZON_CREATORS_PARTNER_TAG", "PILOT_RUN_SECRET"
            ];
            writeFileSync(process.argv[1], JSON.stringify(Object.fromEntries(keys.map(key => [key, process.env[key]]))), { mode: 0o600 });
          ' "$RUNNER_TEMP/amazon-pilot-secrets.json"
      - name: Deploy isolated pilot Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --config wrangler.amazon-creators-pilot.jsonc \
            --name "${{ steps.prepare.outputs.worker_name }}" \
            --secrets-file "$RUNNER_TEMP/amazon-pilot-secrets.json" \
            | tee "$RUNNER_TEMP/amazon-pilot-deploy.log"
          worker_url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$RUNNER_TEMP/amazon-pilot-deploy.log" | tail -1)
          test -n "$worker_url"
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
      - name: Wait for isolated pilot route
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          for attempt in {1..10}; do
            status=$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "${{ steps.deploy.outputs.worker_url }}/health")
            echo "Pilot readiness attempt $attempt: HTTP $status"
            if [[ "$status" == "200" ]]; then exit 0; fi
            if [[ "$attempt" -lt 10 ]]; then sleep 2; fi
          done
          exit 1
      - name: Run one Amazon E2E pilot
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 180 \
            --request POST \
            --header "x-pilot-secret: ${PILOT_RUN_SECRET}" \
            "${{ steps.deploy.outputs.worker_url }}/pilot" \
            --output "$RUNNER_TEMP/amazon-creators-pilot.json" \
            --write-out '%{http_code}')
          if [[ "$status" != "200" && "$status" != "502" ]]; then
            echo "Amazon E2E pilot returned unexpected HTTP $status." >&2
            exit 2
          fi
          node pilot/report-amazon-creators-pilot.mjs "$RUNNER_TEMP/amazon-creators-pilot.json" "$RUNNER_TEMP/amazon-card-pilot"
      - name: Upload Amazon card artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-card-pilot
          path: ${{ runner.temp }}/amazon-card-pilot/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Delete isolated pilot Worker
        if: always() && steps.prepare.outputs.worker_name != ''
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler delete "${{ steps.prepare.outputs.worker_name }}" --force --config wrangler.amazon-creators-pilot.jsonc
