name: Smoke Log Tail

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail-smoke:
    runs-on: ubuntu-latest
    environment: smoke
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Tail smoke Worker for three minutes
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Starting a 180-second JSON tail for affiliate-deal-card-smoke."
          set +e
          timeout 180s npx wrangler tail affiliate-deal-card-smoke \
            --config wrangler.smoke.jsonc --format=json | node -e '
            const { StringDecoder } = require("node:string_decoder");
            const allowed = new Set([
              "queue_job_started", "redirect_resolved", "store_detected",
              "walmart_extraction_diagnostics", "extraction_complete",
              "card_cache_disabled", "card_cache_lookup", "card_cache_miss",
              "card_cache_build_claimed", "card_cache_build_wait", "card_cache_hit",
              "card_cache_corrupt", "card_cache_read_failed", "card_cache_write_failed",
              "ai_complete", "product_image_downloaded", "browser_render_started",
              "browser_render_attempt_failed", "browser_render_complete", "browser_render_failed",
              "card_cache_stored", "process_complete", "process_failed",
              "job_processing_failed", "telegram_photo_sent", "telegram_copy_sent",
              "telegram_delivery_failed"
            ]);
            const fields = [
              "requestId", "store", "hostname", "cacheStatus", "reason", "errorCode",
              "validationReason", "attempt", "attemptsUsed", "browserStatus",
              "browserReason", "retryScheduled", "retryDelayMs", "waitDurationMs",
              "extractionDurationMs", "aiDurationMs", "renderDurationMs",
              "browserDurationMs", "totalDurationMs", "success", "operation",
              "httpStatus", "telegramErrorCode", "telegramDescriptionCategory"
            ];
            const asObject = (value) => {
              if (typeof value === "string") {
                try { value = JSON.parse(value); } catch { return null; }
              }
              return value && typeof value === "object" && !Array.isArray(value) ? value : null;
            };
            const emit = (value) => {
              const entry = asObject(value);
              if (!entry || !allowed.has(entry.event)) return false;
              const safe = { event: entry.event };
              for (const field of fields) {
                const value = entry[field];
                if (typeof value === "string" || typeof value === "number" || typeof value === "boolean") {
                  safe[field] = value;
                }
              }
              process.stdout.write(JSON.stringify(safe) + "\n");
              return true;
            };
            let shapePrinted = false;
            let totalBytesReceived = 0;
            let totalCompleteJsonValues = 0;
            let parseFailureCount = 0;
            const safeKeys = (object) => Object.keys(object).slice(0, 20).map((key) =>
              /^[A-Za-z][A-Za-z0-9_]{0,40}$/.test(key) ? key : "[other]"
            );
            const processTrace = (trace) => {
              const logs = Array.isArray(trace.logs) ? trace.logs : [];
              if (!shapePrinted) {
                const firstLog = asObject(logs[0]);
                const message = firstLog?.message;
                const elements = Array.isArray(message) ? message : message === undefined ? [] : [message];
                process.stdout.write(JSON.stringify({
                  event: "smoke_tail_shape", topLevelKeys: safeKeys(trace),
                  hasLogs: Array.isArray(trace.logs),
                  logsType: Array.isArray(trace.logs) ? "array" : typeof trace.logs,
                  firstLogKeys: firstLog ? safeKeys(firstLog) : [],
                  logMessageType: Array.isArray(message) ? "array" : typeof message,
                  messageElementTypes: [...new Set(elements.map((item) => item === null ? "null" : typeof item))]
                }) + "\n");
                shapePrinted = true;
              }
              if (emit(trace)) return;
              for (const rawLog of logs) {
                const log = asObject(rawLog);
                if (!log || emit(log)) continue;
                const messages = Array.isArray(log.message) ? log.message : [log.message];
                for (const message of messages) emit(message);
              }
            };
            const decoder = new StringDecoder("utf8");
            const maxRecordChars = 8 * 1024 * 1024;
            let record = "";
            let depth = 0;
            let inString = false;
            let escaped = false;
            let oversized = false;
            const append = (part) => {
              if (oversized) return;
              if (record.length + part.length > maxRecordChars) {
                record = "";
                oversized = true;
              } else {
                record += part;
              }
            };
            const scan = (text) => {
              let segmentStart = depth > 0 ? 0 : -1;
              for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (depth === 0) {
                  if (char !== "{") continue;
                  depth = 1;
                  segmentStart = i;
                  inString = false;
                  escaped = false;
                  oversized = false;
                  continue;
                }
                if (inString) {
                  if (escaped) escaped = false;
                  else if (char === "\\") escaped = true;
                  else if (char === "\"") inString = false;
                } else if (char === "\"") inString = true;
                else if (char === "{" || char === "[") depth++;
                else if (char === "}" || char === "]") depth--;
                if (depth === 0) {
                  append(text.slice(segmentStart, i + 1));
                  if (oversized) parseFailureCount++;
                  else {
                    try {
                      const trace = JSON.parse(record);
                      totalCompleteJsonValues++;
                      if (trace && typeof trace === "object" && !Array.isArray(trace)) processTrace(trace);
                    } catch { parseFailureCount++; }
                  }
                  record = "";
                  segmentStart = -1;
                }
              }
              if (depth > 0) append(text.slice(segmentStart));
            };
            process.stdin.on("data", (chunk) => {
              totalBytesReceived += chunk.length;
              scan(decoder.write(chunk));
            });
            process.stdin.on("end", () => {
              scan(decoder.end());
              if (depth > 0) parseFailureCount++;
              if (totalCompleteJsonValues === 0) {
                process.stdout.write(JSON.stringify({
                  event: "smoke_tail_stream_diagnostic", totalBytesReceived,
                  totalCompleteJsonValues, parseFailureCount
                }) + "\n");
              }
            });
          '
          statuses=("${PIPESTATUS[@]}")
          set -e
          if (( statuses[1] != 0 )); then
            exit "${statuses[1]}"
          fi
          if (( statuses[0] == 124 )); then
            echo "Smoke tail capture window complete."
          elif (( statuses[0] != 0 )); then
            exit "${statuses[0]}"
          fi
