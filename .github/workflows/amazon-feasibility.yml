name: Amazon Feasibility

on:
  push:
    branches:
      - test/amazon-feasibility

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: smoke
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy isolated feasibility Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.amazon-feasibility.jsonc | tee /tmp/amazon-feasibility-deploy.log
          worker_url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/amazon-feasibility-deploy.log | tail -1)
          test -n "$worker_url"
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
      - name: Run safe Amazon probes
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --max-time 90 "${{ steps.deploy.outputs.worker_url }}/probe")
          node -e '
            const data=JSON.parse(process.argv[1]);
            const safe=result=>Object.fromEntries(Object.entries(result).filter(([key])=>new Set(["label","httpStatus","browserStatus","originStatus","hostname","contentType","responseByteLength","redirectCount","challengeDetected","consentDetected","hasAsin","hasTitle","hasImage","hasPrice","hasPurchaseOffer","usableProductPage","allowedHost","browserMsUsed","errorCode"]).has(key)));
            console.log(JSON.stringify({worker:data.worker.map(safe),browser:data.browser.map(safe)}));
            if (![...data.worker,...data.browser].some(result=>result.usableProductPage)) process.exitCode=2;
          ' "$response"
      - name: Delete isolated feasibility Worker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request DELETE \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/affiliate-deal-card-amazon-feasibility"
