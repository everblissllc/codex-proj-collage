name: Bubble Browser pilot

on:
  push:
    branches:
      - test/bubble-browser-pilot

permissions:
  contents: read

concurrency:
  group: bubble-browser-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-24.04
    environment: smoke
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc --noEmit -p tsconfig.bubble-pilot.json
      - run: npm test
      - run: git diff --check
      - run: node scripts/check-smoke-config.mjs
      - run: npx wrangler deploy --dry-run --config wrangler.bubble-pilot.jsonc
      - name: Exercise Worker fetch, extraction, pricing, and Browser screenshot
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'Smoke Cloudflare credentials are missing.'
            exit 1
          fi
          npx wrangler dev --remote --config wrangler.bubble-pilot.jsonc --ip 127.0.0.1 --port 8787 --log-level warn > "$RUNNER_TEMP/bubble-pilot-wrangler.log" 2>&1 &
          pilot_pid=$!
          trap 'kill "$pilot_pid" 2>/dev/null || true; wait "$pilot_pid" 2>/dev/null || true; echo "Temporary Bubble Browser preview session stopped."' EXIT
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 2 --output /dev/null http://127.0.0.1:8787/health; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            echo 'Temporary Bubble preview did not become ready.'
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 120 --dump-header "$RUNNER_TEMP/bubble-pilot.headers" --output "$RUNNER_TEMP/bubble-mobile-pilot.png" --write-out '%{http_code}' http://127.0.0.1:8787/pilot)
          if [[ "$status" != 200 ]]; then
            echo "Bubble pilot failed with endpoint HTTP $status."
            python3 - "$RUNNER_TEMP/bubble-mobile-pilot.png" <<'PY'
          import json, pathlib, sys
          try:
              payload=json.loads(pathlib.Path(sys.argv[1]).read_text())
          except (OSError, UnicodeError, json.JSONDecodeError):
              payload={}
          allowed=('event','store','errorCode','errorStage','saleFetch','regularFetch','browserStatus','browserReason','success')
          print(json.dumps({key:payload[key] for key in allowed if key in payload},separators=(',',':')))
          PY
            exit 1
          fi
          python3 - "$RUNNER_TEMP/bubble-mobile-pilot.png" "$RUNNER_TEMP/bubble-pilot.headers" <<'PY'
          import json, pathlib, struct, sys
          data=pathlib.Path(sys.argv[1]).read_bytes()
          if len(data)<24 or data[:8]!=b'\x89PNG\r\n\x1a\n': raise SystemExit('Bubble pilot output is not PNG')
          width,height=struct.unpack('>II',data[16:24])
          if not width or not height or len(data)>10_000_000 or width+height>10_000 or max(width,height)/min(width,height)>20:
              raise SystemExit('Bubble pilot PNG is outside Telegram photo limits')
          headers={}
          for line in pathlib.Path(sys.argv[2]).read_text().splitlines():
              if ':' in line:
                  key,value=line.split(':',1); headers[key.strip().lower()]=value.strip()
          fields={
              'event':'bubble_pilot_png','store':'bubble','hostname':'hellobubble.com','endpointHttpStatus':200,
              'workerFetchHttpStatus':int(headers['x-pilot-sale-http-status']),
              'contentType':headers['x-pilot-sale-content-type'],'responseByteLength':int(headers['x-pilot-sale-response-bytes']),
              'redirectCount':int(headers['x-pilot-sale-redirect-count']),'currentPrice':headers['x-pilot-sale-current-price'],
              'oldPrice':headers['x-pilot-sale-old-price'],'variantSelection':headers['x-pilot-variant-selection'],
              'regularFetchHttpStatus':int(headers['x-pilot-regular-http-status']),'regularCurrentPrice':headers['x-pilot-regular-current-price'],
              'outputBytes':len(data),'width':width,'height':height,'aspectRatio':round(width/height,3)
          }
          print(json.dumps(fields,separators=(',',':')))
          PY
          grep -E '"event":"(bubble_pilot_|mobile_product_screenshot_)' "$RUNNER_TEMP/bubble-pilot-wrangler.log" || true
      - name: Upload Bubble screenshot for visual review
        uses: actions/upload-artifact@v4
        with:
          name: bubble-mobile-pilot
          path: ${{ runner.temp }}/bubble-mobile-pilot.png
          if-no-files-found: error
          retention-days: 3
