name: Production Log Tail

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail-production:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Tail production Worker for three minutes
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Starting a 180-second JSON tail for affiliate-deal-card-bot."
          set +e
          timeout 180s npx wrangler tail affiliate-deal-card-bot \
            --config wrangler.jsonc --format=json | node -e '
            const { StringDecoder } = require("node:string_decoder");
            const allowed = new Set([
              "webhook_accepted", "queue_send_failed", "queue_job_started",
              "redirect_resolved", "store_detected",
              "walmart_extraction_diagnostics", "extraction_complete",
              "card_cache_disabled", "card_cache_lookup", "card_cache_miss",
              "card_cache_build_claimed", "card_cache_build_wait", "card_cache_hit",
              "card_cache_corrupt", "card_cache_read_failed", "card_cache_write_failed",
              "ai_complete", "product_image_downloaded", "browser_render_started",
              "browser_render_attempt_failed", "browser_render_complete", "browser_render_failed",
              "card_cache_stored", "process_complete", "process_failed",
              "job_processing_failed", "telegram_photo_sent", "telegram_copy_sent",
              "telegram_photo_prepared", "telegram_delivery_failed", "telegram_error_message_failed",
              "amazon_source_identity", "walmart_sovrn_decision", "homedepot_sovrn_decision",
              "homedepot_fetch_diagnostics"
            ]);
            const fields = [
              "requestId", "store", "hostname", "cacheStatus", "reason", "errorCode",
              "validationReason", "attempt", "attemptsUsed", "browserStatus",
              "browserReason", "retryScheduled", "retryDelayMs", "waitDurationMs",
              "extractionDurationMs", "aiDurationMs", "renderDurationMs",
              "browserDurationMs", "totalDurationMs", "success", "operation",
              "httpStatus", "telegramErrorCode", "telegramDescriptionCategory"
            ];
            const safeTelegramDescription = (value) => {
              if (typeof value !== "string") return undefined;
              const text = value.trim();
              if (!text || [...text].length > 200 || /[\r\n\u0000-\u001f\u007f]/.test(text)) return undefined;
              if (/https?:\/\/|bot\d{6,}:[A-Za-z0-9_-]{20,}|\b\d{8,}\b/i.test(text)) return undefined;
              return /^[\x20-\x7e]+$/.test(text) ? text : undefined;
            };
            const safeAmazonHostname = (value) =>
              typeof value === "string" && /^(?:[a-z0-9-]+\.)*amazon\.com$/i.test(value) ? value.toLowerCase() : undefined;
            const safeAmazonIdentityStatus = (value) =>
              ["SOURCE_CONFIRMED", "SOURCE_CONFLICT", "SOURCE_UNCONFIRMED"].includes(value) ? value : undefined;
            const asObject = (value) => {
              if (typeof value === "string") {
                try { value = JSON.parse(value); } catch { return null; }
              }
              return value && typeof value === "object" && !Array.isArray(value) ? value : null;
            };
            const emit = (value) => {
              const entry = asObject(value);
              if (!entry || !allowed.has(entry.event)) return false;
              if (entry.event === "telegram_photo_prepared") {
                const safe = { event: entry.event };
                for (const field of ["width", "height", "byteSize"]) {
                  if (Number.isInteger(entry[field]) && entry[field] >= 0) safe[field] = entry[field];
                }
                if (typeof entry.validPng === "boolean") safe.pngSignatureValid = entry.validPng;
                if (typeof entry.telegramPhotoLimitsValid === "boolean") safe.telegramDimensionsValid = entry.telegramPhotoLimitsValid;
                if (typeof entry.mimeType === "string" && /^image\/(?:png|jpeg|webp)$/.test(entry.mimeType)) safe.mimeType = entry.mimeType;
                process.stdout.write(JSON.stringify(safe) + "\n");
                return true;
              }
              if (["telegram_delivery_failed", "telegram_error_message_failed"].includes(entry.event)) {
                const safe = { event: entry.event };
                if (Number.isInteger(entry.httpStatus) && entry.httpStatus >= 100 && entry.httpStatus <= 599) safe.httpStatus = entry.httpStatus;
                if (typeof entry.telegramDescriptionCategory === "string" && /^[A-Z_]{1,40}$/.test(entry.telegramDescriptionCategory)) {
                  safe.category = entry.telegramDescriptionCategory;
                }
                const description = safeTelegramDescription(entry.telegramDescription);
                if (description) safe.telegramDescription = description;
                process.stdout.write(JSON.stringify(safe) + "\n");
                return true;
              }
              if (entry.event === "amazon_source_identity") {
                const safe = { event: entry.event };
                const finalHostname = safeAmazonHostname(entry.hostname);
                if (finalHostname) safe.finalHostname = finalHostname;
                const source = entry.sourceIdentitySource;
                const supported = source === "resolved-product-route";
                const canonical = source === "canonical";
                const jsonLd = source === "json-ld";
                const addToCart = source === "add-to-cart";
                safe.supportedRouteIdentityPresent = supported;
                safe.canonicalIdentityPresent = canonical;
                safe.jsonLdIdentityPresent = jsonLd;
                safe.addToCartIdentityPresent = addToCart;
                if (supported) safe.finalRouteCategory = "SUPPORTED_PRODUCT_ROUTE";
                else if (canonical || jsonLd || addToCart) {
                  safe.finalRouteCategory = "OTHER_AMAZON_ROUTE";
                  safe.pageReadSucceeded = true;
                }
                const identityStatus = safeAmazonIdentityStatus(entry.sourceIdentityState);
                if (identityStatus) safe.identityStatus = identityStatus;
                if (typeof entry.errorCode === "string" && /^[A-Z][A-Z0-9_]{1,63}$/.test(entry.errorCode)) safe.errorCode = entry.errorCode;
                process.stdout.write(JSON.stringify(safe) + "\n");
                return true;
              }
              if (entry.event === "walmart_sovrn_decision") {
                const safe = { event: entry.event };
                if (["ACCEPTED", "NO_OFFER", "NO_SAME_RETAILER", "IDENTITY_REJECTED", "PRICE_MISMATCH", "INVALID_PRICE", "INVALID_IMAGE", "TIMEOUT", "PROVIDER_ERROR", "NOT_CONFIGURED"].includes(entry.sovrnStatus)) safe.sovrnStatus = entry.sovrnStatus;
                if (["EXACT_VARIANT_MATCH", "NO_VARIANT_CONFLICT", "VARIANT_CONFLICT", "VARIANT_AMBIGUOUS_HIGH_RISK"].includes(entry.identityClassification)) safe.identityClassification = entry.identityClassification;
                if (["EXACT", "DIFFERENT", "UNAVAILABLE"].includes(entry.priceParity)) safe.priceParity = entry.priceParity;
                for (const field of ["walmartCurrentCents", "sovrnCurrentCents"]) {
                  if (Number.isSafeInteger(entry[field]) && entry[field] > 0) safe[field] = entry[field];
                }
                if (Number.isSafeInteger(entry.deltaCents)) safe.deltaCents = entry.deltaCents;
                if (["EXACT", "DIFFERENT", "WALMART_ONLY", "SOVRN_ONLY", "NEITHER"].includes(entry.referenceParity)) safe.referenceParity = entry.referenceParity;
                if (typeof entry.sovrnImageValid === "boolean") safe.sovrnImageValid = entry.sovrnImageValid;
                if (["SOVRN_ENRICHED", "WALMART_FALLBACK"].includes(entry.finalSource)) safe.finalSource = entry.finalSource;
                process.stdout.write(JSON.stringify(safe) + "\n");
                return true;
              }
              if (entry.event === "homedepot_sovrn_decision") {
                const safe = { event: entry.event };
                if (["ACCEPTED", "NO_OFFER", "NO_SAME_RETAILER", "AMBIGUOUS_OFFER", "IDENTITY_REJECTED", "INVALID_PRICE", "INVALID_IMAGE", "TIMEOUT", "PROVIDER_ERROR", "NOT_CONFIGURED"].includes(entry.sovrnStatus)) safe.sovrnStatus = entry.sovrnStatus;
                if (Number.isSafeInteger(entry.sameRetailerOfferCount) && entry.sameRetailerOfferCount >= 0) safe.sameRetailerOfferCount = entry.sameRetailerOfferCount;
                if (typeof entry.currentPriceValid === "boolean") safe.currentPriceValid = entry.currentPriceValid;
                if (["VALID", "ABSENT", "SUPPRESSED_INVALID"].includes(entry.referencePriceStatus)) safe.referencePriceStatus = entry.referencePriceStatus;
                if (typeof entry.sovrnImageValid === "boolean") safe.sovrnImageValid = entry.sovrnImageValid;
                if (["SOVRN_PRIMARY", "NONE"].includes(entry.finalSource)) safe.finalSource = entry.finalSource;
                process.stdout.write(JSON.stringify(safe) + "\n");
                return true;
              }
              if (entry.event === "homedepot_fetch_diagnostics") {
                const safe = { event: entry.event };
                if (Number.isInteger(entry.httpStatus) && entry.httpStatus >= 100 && entry.httpStatus <= 599) safe.httpStatus = entry.httpStatus;
                if (typeof entry.responseOk === "boolean") safe.responseOk = entry.responseOk;
                if (typeof entry.normalizedContentType === "string" && /^(?:[a-z0-9.+-]+\/[a-z0-9.+-]+|unknown)$/.test(entry.normalizedContentType)) safe.normalizedContentType = entry.normalizedContentType;
                if (Number.isSafeInteger(entry.responseByteLength) && entry.responseByteLength >= 0) safe.responseByteLength = entry.responseByteLength;
                if (Number.isInteger(entry.redirectCount) && entry.redirectCount >= 0 && entry.redirectCount <= 5) safe.redirectCount = entry.redirectCount;
                if (typeof entry.finalHostIsHomeDepot === "boolean") safe.finalHostIsHomeDepot = entry.finalHostIsHomeDepot;
                if (typeof entry.challengeIndicator === "boolean") safe.challengeIndicator = entry.challengeIndicator;
                if (["SUCCESS_HTML", "FORBIDDEN", "RATE_LIMITED", "SERVICE_UNAVAILABLE", "REDIRECT_ERROR", "CHALLENGE_OR_INTERSTITIAL", "NON_HTML", "OTHER_HTTP_ERROR"].includes(entry.responseClass)) safe.responseClass = entry.responseClass;
                process.stdout.write(JSON.stringify(safe) + "\n");
                return true;
              }
              const safe = { event: entry.event };
              for (const field of fields) {
                const value = entry[field];
                if (typeof value === "string" || typeof value === "number" || typeof value === "boolean") {
                  safe[field] = value;
                }
              }
              process.stdout.write(JSON.stringify(safe) + "\n");
              return true;
            };
            let shapePrinted = false;
            let totalBytesReceived = 0;
            let totalCompleteJsonValues = 0;
            let parseFailureCount = 0;
            const safeKeys = (object) => Object.keys(object).slice(0, 20).map((key) =>
              /^[A-Za-z][A-Za-z0-9_]{0,40}$/.test(key) ? key : "[other]"
            );
            const safeIngress = (trace) => {
              const trigger = asObject(trace.event);
              const request = asObject(trigger?.request) ?? asObject(trace.request);
              const response = asObject(trigger?.response) ?? asObject(trace.response);
              const outcome = typeof trace.outcome === "string" && /^[A-Za-z_]{1,30}$/.test(trace.outcome)
                ? trace.outcome : undefined;
              const rawType = trace.eventType ?? trigger?.type;
              const eventType = typeof rawType === "string" && /^(fetch|queue|scheduled|alarm|tail|email)$/.test(rawType)
                ? rawType : request ? "fetch" : undefined;
              const method = typeof request?.method === "string" && /^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$/.test(request.method)
                ? request.method : undefined;
              let pathname;
              if (typeof request?.url === "string") {
                try {
                  const path = new URL(request.url).pathname;
                  pathname = ["/telegram/webhook", "/health", "/"].includes(path) ? path : "[other]";
                } catch { pathname = undefined; }
              }
              const rawStatus = response?.status ?? trace.httpStatus;
              const httpStatus = Number.isInteger(rawStatus) && rawStatus >= 100 && rawStatus <= 599
                ? rawStatus : undefined;
              return { outcome, eventType, method, pathname, httpStatus };
            };
            const processTrace = (trace) => {
              const logs = Array.isArray(trace.logs) ? trace.logs : [];
              const ingress = safeIngress(trace);
              if (!shapePrinted) {
                const firstLog = asObject(logs[0]);
                const message = firstLog?.message;
                const elements = Array.isArray(message) ? message : message === undefined ? [] : [message];
                process.stdout.write(JSON.stringify({
                  event: "production_tail_shape", topLevelKeys: safeKeys(trace),
                  hasLogs: Array.isArray(trace.logs),
                  logsType: Array.isArray(trace.logs) ? "array" : typeof trace.logs,
                  firstLogKeys: firstLog ? safeKeys(firstLog) : [],
                  logMessageType: Array.isArray(message) ? "array" : typeof message,
                  messageElementTypes: [...new Set(elements.map((item) => item === null ? "null" : typeof item))],
                  ...ingress
                }) + "\n");
                shapePrinted = true;
              }
              process.stdout.write(JSON.stringify({ event: "production_tail_ingress", ...ingress }) + "\n");
              if (emit(trace)) return;
              for (const rawLog of logs) {
                const log = asObject(rawLog);
                if (!log || emit(log)) continue;
                const messages = Array.isArray(log.message) ? log.message : [log.message];
                for (const message of messages) emit(message);
              }
            };
            const decoder = new StringDecoder("utf8");
            const maxRecordChars = 8 * 1024 * 1024;
            let record = "";
            let depth = 0;
            let inString = false;
            let escaped = false;
            let oversized = false;
            const append = (part) => {
              if (oversized) return;
              if (record.length + part.length > maxRecordChars) {
                record = "";
                oversized = true;
              } else {
                record += part;
              }
            };
            const scan = (text) => {
              let segmentStart = depth > 0 ? 0 : -1;
              for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (depth === 0) {
                  if (char !== "{") continue;
                  depth = 1;
                  segmentStart = i;
                  inString = false;
                  escaped = false;
                  oversized = false;
                  continue;
                }
                if (inString) {
                  if (escaped) escaped = false;
                  else if (char === "\\") escaped = true;
                  else if (char === "\"") inString = false;
                } else if (char === "\"") inString = true;
                else if (char === "{" || char === "[") depth++;
                else if (char === "}" || char === "]") depth--;
                if (depth === 0) {
                  append(text.slice(segmentStart, i + 1));
                  if (oversized) parseFailureCount++;
                  else {
                    try {
                      const trace = JSON.parse(record);
                      totalCompleteJsonValues++;
                      if (trace && typeof trace === "object" && !Array.isArray(trace)) processTrace(trace);
                    } catch { parseFailureCount++; }
                  }
                  record = "";
                  segmentStart = -1;
                }
              }
              if (depth > 0) append(text.slice(segmentStart));
            };
            process.stdin.on("data", (chunk) => {
              totalBytesReceived += chunk.length;
              scan(decoder.write(chunk));
            });
            process.stdin.on("end", () => {
              scan(decoder.end());
              if (depth > 0) parseFailureCount++;
              if (totalCompleteJsonValues === 0) {
                process.stdout.write(JSON.stringify({
                  event: "production_tail_stream_diagnostic", totalBytesReceived,
                  totalCompleteJsonValues, parseFailureCount
                }) + "\n");
              }
            });
          '
          statuses=("${PIPESTATUS[@]}")
          set -e
          if (( statuses[1] != 0 )); then
            exit "${statuses[1]}"
          fi
          if (( statuses[0] == 124 )); then
            echo "Production tail capture window complete."
          elif (( statuses[0] != 0 )); then
            exit "${statuses[0]}"
          fi
