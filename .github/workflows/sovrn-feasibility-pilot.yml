name: Sovrn Feasibility Pilot

on:
  push:
    branches:
      - test/sovrn-feasibility

jobs:
  pilot:
    runs-on: ubuntu-latest
    environment: sovrn-pilot
    env:
      SOVRN_SECRET_KEY: ${{ secrets.SOVRN_SECRET_KEY }}
      SOVRN_SITE_API_KEY: ${{ secrets.SOVRN_SITE_API_KEY }}
      SOVRN_MARKET: ${{ vars.SOVRN_MARKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in SOVRN_SECRET_KEY SOVRN_SITE_API_KEY SOVRN_MARKET; do
            if [[ -z "${!key:-}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing sovrn-pilot configuration key: %s\n' "${missing[@]}" >&2
            exit 2
          fi
      - name: Validate source and direct pilot
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          git diff --check
          node scripts/check-smoke-config.mjs
          npx tsc --noEmit -p tsconfig.sovrn-direct-pilot.json
      - name: Run direct sanitized Walmart and e.l.f. verification
        shell: bash
        run: |
          set -euo pipefail
          pilot_out="$RUNNER_TEMP/sovrn-direct-pilot"
          mkdir -p "$pilot_out"
          npx tsc -p tsconfig.sovrn-direct-pilot.json --noEmit false --outDir "$pilot_out"
          node "$pilot_out/pilot/sovrn-walmart-elf-runner.js"
